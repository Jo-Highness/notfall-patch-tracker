# Wegwerf-Testumgebung (eigenes Compose-Projekt), z. B.:
#   docker compose -p npt-test -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
#   docker compose -p npt-test -f docker-compose.test.yml down -v
# Nur Testdaten, keine Ports, DB im tmpfs.
services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: npt_test
      POSTGRES_USER: npt
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-npt-test-only}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npt -d npt_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      NPT_TEST_DATABASE_URL: postgresql+psycopg://npt:${TEST_DB_PASSWORD:-npt-test-only}@db:5432/npt_test
    command: ${TEST_COMMAND:-sh -c "ruff check . && ruff format --check . && mypy && pytest -q"}
