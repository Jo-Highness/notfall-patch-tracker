# kind-Cluster fuer den Chart-Test: API-Server nur auf 127.0.0.1, keine extraPortMappings
# (kein Host-Port); Zugriff auf NodePorts nur aus dem Docker-Netz "kind".
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: npt-kind
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
