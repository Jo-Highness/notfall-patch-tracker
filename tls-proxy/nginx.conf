# public-tls: TLS-Proxy vor dem Bearbeiter-Port der App (Overlay docker-compose.tls.yml).
# Der Server-Block kommt aus /etc/nginx/templates/default.conf.template (envsubst des
# offiziellen nginx-Entrypoints, nur gesetzte Umgebungsvariablen werden ersetzt).
worker_processes auto;
worker_rlimit_nofile 16384;
pid /run/nginx.pid;
# error_log enthaelt bei Upstream-Fehlern die Request-Zeile samt Projekt-Token
# (Auftrag 8.2: Token nie ins Log) -> nur crit.
error_log /dev/stderr crit;

events { worker_connections 8192; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # Projekt-Token maskiert, ohne Query-String und ohne Header-Inhalte (Referer!).
    map $uri $npt_log_uri {
        ~^(?<pre>/p/)[^/]+(?<rest>.*)$  $pre***$rest;
        default                         $uri;
    }
    log_format json escape=json '{"ts":"$time_iso8601","component":"public-tls",'
        '"remote":"$remote_addr","method":"$request_method","uri":"$npt_log_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"proto":"$server_protocol"}';
    access_log /dev/stdout json;

    include /etc/nginx/conf.d/*.conf;
}
