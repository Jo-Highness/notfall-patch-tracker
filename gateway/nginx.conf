# admin-gateway: Hauptkonfiguration. Der Server-Block wird zur Laufzeit aus
# /etc/npt-gateway/admin.conf.template gerendert (entrypoint.sh).
# worker_processes aus GATEWAY_WORKER_PROCESSES (Default auto), gerendert vom entrypoint.
include /etc/nginx/conf.d/npt-main.inc;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # JSON-Access-Log nach stdout; Zertifikats-Subject zur Nachvollziehbarkeit,
    # keine Header-Inhalte.
    log_format json escape=json '{"ts":"$time_iso8601","component":"admin-gateway",'
        '"remote":"$remote_addr","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
        '"verify":"$ssl_client_verify","subject":"$ssl_client_s_dn"}';
    access_log /dev/stdout json;

    include /etc/nginx/conf.d/*.conf;
}
