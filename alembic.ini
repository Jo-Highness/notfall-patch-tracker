# Nur fuer manuelle Alembic-Aufrufe in der Entwicklung (z. B. `alembic revision`).
# Im Betrieb migriert `npt-run` selbst unter Advisory Lock (NPT-02).
[alembic]
script_location = npt:migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
