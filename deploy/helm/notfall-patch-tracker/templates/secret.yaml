{{- if .Values.secrets.create }}
{{- /* Nur Dev/Test: Werte landen im Release (und mit helm template im Manifest). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "npt.secretName" . }}
  labels:
    {{- include "npt.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
